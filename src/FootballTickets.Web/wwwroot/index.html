<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FootballTickets.Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="FootballTickets.Web.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
            // время матча в часовом поясе браузера
            window.formatLocal = (iso) =>
                new Date(iso).toLocaleString('ru-RU', { dateStyle: 'medium', timeStyle: 'short' });
            // значение поля datetime-local (локальное время) в ISO UTC
            window.localInputToIso = (value) => new Date(value).toISOString();
            window.confirmAction = (text) => confirm(text);
    </script>


</body>

</html>
